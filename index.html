<script>
// Runs before anything else: sets the right layout class immediately, and shows a
// readable message (with a clean-reload button) if the game fails to start.
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('atlas-atoms-device') || localStorage.getItem('atlas-atoms-v1') || '{}'), pref = s.layout || 'auto';
    var w = innerWidth, h = innerHeight, c = document.documentElement.classList, mode = 'desktop';
    if (pref === 'phone' || pref === 'tablet') mode = pref;
    else if (w <= 760 || h <= 520) mode = 'phone';
    else if (matchMedia('(pointer: coarse)').matches) mode = 'tablet';
    if (mode === 'phone') c.add('m-phone');
    if (mode === 'tablet') c.add('m-tablet');
    if (w > h) c.add('m-land');
    if (w < 1000) c.add('m-narrow');
  } catch (e) { /* ignore */ }
  var shown = false;
  function fatal(msg) {
    if (shown) return; shown = true;
    window.addEventListener('DOMContentLoaded', put); if (document.body) put();
    function put() {
      if (document.getElementById('fatal')) return;
      var d = document.createElement('div'); d.id = 'fatal';
      d.setAttribute('style', 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#3a1620;border:2px solid #ff6b6b;color:#fff;border-radius:12px;padding:12px;font:15px system-ui,sans-serif');
      d.innerHTML = '<b>The game hit a problem while loading.</b><br><small style="opacity:.85"></small><br>' +
        '<button style="margin-top:8px;padding:10px 14px;font-size:16px;border-radius:10px;border:0;background:#3dd6c6;color:#07302c;font-weight:bold">Reload fresh</button>';
      d.querySelector('small').textContent = msg;
      d.querySelector('button').onclick = function () {
        var jobs = [];
        if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      };
      document.body.appendChild(d);
    }
  }
  window.addEventListener('error', function (e) {
    if (e && e.message && String(e.filename || '').indexOf(location.origin) === 0) fatal(e.message + ' (' + String(e.filename).split('/').pop().split('?')[0] + ':' + e.lineno + ')');
  });
})();
</script>

<body>
<header class="top">
  <h1><span class="logo">⚛</span><span class="name"> Atlas’ Atoms</span></h1>
  <nav>
    <label class="chk" title="Read tips and lessons out loud"><input type="checkbox" id="chkVoice"> 🗣<span class="lbl"> Read aloud</span></label>
    <button id="btnProfile" class="pill" aria-label="Profile"></button>
    <button id="btnLab" class="pill" aria-label="Molecule Lab">🔬<span class="lbl"> Molecule Lab</span></button>
    <button id="btnBadges" class="pill" aria-label="Badges">🏅<span class="lbl"> Badges</span> <span id="bcount"></span></button>
    <button id="btnLessons" class="pill" aria-label="Lessons">🎓<span class="lbl"> Lessons</span> <span id="lcount"></span></button>
    <button id="btnAtlas" class="pill" aria-label="My Atlas">📖<span class="lbl"> My Atlas</span> <span id="count"></span></button>
    <button id="btnLayout" class="pill" aria-label="Screen layout"></button>
    <button id="btnInfo" class="pill mobileOnly" aria-label="Mission and info">📋</button>
    <button id="btnSound" class="pill" title="Sound on/off">🔊</button>
    <button id="btnHelp" class="pill" title="How to play">?</button>
  </nav>
</header>
<main class="layout">
  <aside id="tray">
    <h2>Atoms</h2>
    <div id="trayList"></div>
    <p class="trayHint">Drag an atom onto the bench. Drop it back here to remove it. Click one to learn about it.</p>
  </aside>
  <section class="benchwrap">
    <div class="toolbar">
      <div class="seg" id="modes">
        <button data-mode="ball" class="on">Ball &amp; Stick</button>
        <button data-mode="space">Space-filling</button>
        <button data-mode="lewis">Electrons</button>
        <button data-mode="orbital">Orbitals</button>
      </div>
      <div class="seg" id="tools">
        <button data-tool="build" class="on">✋ Build</button>
        <button data-tool="cut">✂ Cut bond</button>
      </div>
      <button id="btnRecenter" class="pill">🎯 Reset view</button>
      <button id="btnShake" class="pill" title="Shake everything">🌀 Shake</button>
      <button id="btnClear" class="pill">🧹 Clear</button>
      <label class="chk"><input type="checkbox" id="chkFaces" checked> Faces</label>
    </div>
    <div class="caption" id="caption"></div>
    <div class="canvasbox">
      <canvas id="bench"></canvas>
      <div id="tip" class="tip"></div>
      <div id="banner" class="banner hidden"></div>
    </div>
  </section>
  <aside id="side">
    <button id="btnSideClose" class="pill sideclose">✕ Close</button>
    <section class="card" id="mission"></section>
    <section class="card hidden" id="elementCard"></section>
    <section class="card"><h3>On your bench</h3><div id="benchList"></div></section>
    <section class="card"><h3>⚡ Reactions</h3><div id="reactions"></div></section>
  </aside>
</main>
